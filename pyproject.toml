[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-react-agent"
version = "0.1.0"
description = "Production-oriented Self-Correcting ReAct SQL Agent"
requires-python = ">=3.11"
dependencies = [
    "groq>=0.11.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlglot>=25.0.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]